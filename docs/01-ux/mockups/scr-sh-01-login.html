<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-SH-01 · Login · PMS mockup</title>
<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --border: #dde3ea; --border-strong: #c3ccd7;
    --text: #1f2933; --text-2: #52606d; --text-3: #7b8794;
    --primary: #1f5fae; --primary-hover: #184d8e; --primary-tint: #e8f0fa;
    --danger: #b42318; --danger-tint: #fdeceb; --warning: #a35f00; --warning-tint: #fdf1dc;
    --radius: 8px; --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font: 14px/1.5 var(--font); color: var(--text); background: var(--bg); }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .mock-bar { background: #fff8db; border-bottom: 1px dashed #d4a800; padding: 6px 24px; font-size: 12px; color: #5c4a00; display: flex; gap: 16px; align-items: center; }
  .mock-bar strong { letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
  .mock-bar select { font: inherit; font-size: 12px; }

  .wrap { min-height: calc(100vh - 31px); display: grid; place-items: center; padding: 32px; }
  .card { width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 36px 36px 28px; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .brand b { display: block; font-size: 17px; }
  .brand span { font-size: 13px; color: var(--text-3); }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-2); margin: 0 0 22px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  .input { position: relative; }
  input[type=text], input[type=password] { width: 100%; height: 40px; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 0 12px; font: inherit; color: var(--text); background: #fff; }
  input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-tint); }
  input.invalid { border-color: var(--danger); }
  .hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .err-text { font-size: 12px; color: var(--danger); margin-top: 4px; display: none; }
  .toggle { position: absolute; right: 8px; top: 8px; background: none; border: 0; color: var(--primary); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 4px; }
  .btn { width: 100%; height: 42px; border: 0; border-radius: var(--radius); background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .btn:hover { background: var(--primary-hover); }
  .btn[disabled] { opacity: .7; cursor: progress; }
  .alert { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 18px; font-size: 13px; display: none; }
  .alert.error { background: var(--danger-tint); color: var(--danger); border: 1px solid #f5c2bd; }
  .alert.warn { background: var(--warning-tint); color: var(--warning); border: 1px solid #f3d29a; }
  .help { margin-top: 18px; font-size: 13px; color: var(--text-2); text-align: center; }
  .foot { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 18px; }
</style>
</head>
<body>
  <div class="mock-bar" role="region" aria-label="Mockup controls">
    <strong>Mockup controls</strong>
    Scenario on Sign in:
    <select id="scenario" aria-label="Scenario">
      <option value="ok">Valid credentials → Dashboard</option>
      <option value="first">First login (temporary password) → Set password</option>
      <option value="bad">Wrong Employee Id or password</option>
      <option value="inactive">Account deactivated</option>
      <option value="locked">Too many attempts (locked 15 min)</option>
    </select>
    <span style="margin-left:auto">SCR-SH-01 · Login · v0.1 · built as a Keycloak login theme</span>
  </div>

  <div class="wrap">
    <form class="card" id="form" novalidate>
      <div class="brand"><div class="brand-mark" aria-hidden="true">P</div><div><b>PMS</b><span>Payroll Management System</span></div></div>
      <h1>Sign in</h1>
      <p class="sub">Use your Employee Id and password.</p>

      <div class="alert error" id="alertError" role="alert"></div>
      <div class="alert warn" id="alertWarn" role="alert"></div>

      <div class="field">
        <label for="empId">Employee Id</label>
        <input type="text" id="empId" placeholder="e.g. EMP0007" autocomplete="username" autofocus>
        <div class="err-text" id="empErr">Enter your Employee Id.</div>
      </div>
      <div class="field">
        <label for="pwd">Password</label>
        <div class="input">
          <input type="password" id="pwd" autocomplete="current-password">
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
        <div class="err-text" id="pwdErr">Enter your password.</div>
      </div>
      <button class="btn" id="submit" type="submit">Sign in</button>

      <p class="help">Forgot your password? Contact your PMS administrator.</p>
      <div class="foot">PMS POC · v0.1</div>
    </form>
  </div>

<script>
  const $ = id => document.getElementById(id);
  $('toggle').addEventListener('click', () => {
    const show = $('pwd').type === 'password';
    $('pwd').type = show ? 'text' : 'password';
    $('toggle').textContent = show ? 'Hide' : 'Show';
    $('toggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  function reset() {
    ['alertError', 'alertWarn', 'empErr', 'pwdErr'].forEach(i => $(i).style.display = 'none');
    ['empId', 'pwd'].forEach(i => $(i).classList.remove('invalid'));
  }
  $('form').addEventListener('submit', e => {
    e.preventDefault(); reset();
    let ok = true;
    if (!$('empId').value.trim()) { $('empErr').style.display = 'block'; $('empId').classList.add('invalid'); ok = false; }
    if (!$('pwd').value) { $('pwdErr').style.display = 'block'; $('pwd').classList.add('invalid'); ok = false; }
    if (!ok) return;
    const s = $('scenario').value;
    const btn = $('submit'); btn.disabled = true; btn.textContent = 'Signing in…';
    setTimeout(() => {
      btn.disabled = false; btn.textContent = 'Sign in';
      if (s === 'ok') location.href = 'scr-sh-03-dashboard.html';
      else if (s === 'first') location.href = 'scr-sh-02-set-password.html?first=1';
      else if (s === 'bad') { $('alertError').textContent = 'Employee Id or password is incorrect. Please try again.'; $('alertError').style.display = 'block'; $('pwd').value = ''; $('pwd').focus(); }
      else if (s === 'inactive') { $('alertError').textContent = 'Your account is inactive. Contact your PMS administrator.'; $('alertError').style.display = 'block'; }
      else { $('alertWarn').textContent = 'Too many failed attempts. Your account is locked for 15 minutes.'; $('alertWarn').style.display = 'block'; }
    }, 600);
  });
</script>
</body>
</html>
